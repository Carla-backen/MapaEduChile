{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agregar recurso</title>

    <link rel="stylesheet" href="{% static 'recursosApp/css/estilos.css' %}">
</head>

<body>

    <main class="contenedor">

        <h1 class="titulo-editar">
            Agregar recurso educativo
        </h1>

        <form method="POST" class="form-editar">

            {% csrf_token %}


            <!-- NOMBRE -->
            <label for="nombre">
                Nombre:
            </label>

            <input
                class="campo-formulario"
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ej: Biblioteca Municipal"
                required
            >


            <!-- DESCRIPCIÓN -->
            <label for="descripcion">
                Descripción:
            </label>

            <input
                class="campo-formulario"
                type="text"
                id="descripcion"
                name="descripcion"
                placeholder="Describe brevemente el recurso"
                required
            >


            <!-- COMUNA -->
            <label for="comuna">
                Comuna:
            </label>

            <select
                class="campo-formulario"
                id="comuna"
                name="comuna"
                required
            >

                <option value="" selected disabled>
                    Selecciona una comuna
                </option>

                {% for comuna in comunas %}

                    <option value="{{ comuna.id }}">
                        {{ comuna.nombre }} - {{ comuna.region }}
                    </option>

                {% endfor %}

            </select>


            <!-- CATEGORÍA -->
            <label for="categoria">
                Categoría:
            </label>

            <select
                class="campo-formulario"
                id="categoria"
                name="categoria"
                required
            >

                <option value="" selected disabled>
                    Selecciona una categoría
                </option>

                {% for categoria in categorias %}

                    <option value="{{ categoria.id }}">
                        {{ categoria.nombre }}
                    </option>

                {% endfor %}

            </select>


            <!-- DIRECCIÓN -->
            <label for="direccion">
                Dirección:
            </label>

            <input
                class="campo-formulario"
                type="text"
                id="direccion"
                name="direccion"
                placeholder="Ej: Av. Principal 123"
            >


            <!-- SITIO WEB -->
            <label for="sitio_web">
                Sitio web:
            </label>

            <input
                class="campo-formulario"
                type="url"
                id="sitio_web"
                name="sitio_web"
                placeholder="https://www.ejemplo.cl"
            >


            <!-- GRATUITO -->
            <div class="campo-gratuito">

                <input
                    type="checkbox"
                    id="gratuito"
                    name="gratuito"
                >

                <label for="gratuito">
                    Gratuito
                </label>

            </div>


            <!-- GUARDAR -->
            <button type="submit">
                Guardar recurso
            </button>


            <!-- CANCELAR -->
            <a href="{% url 'inicio' %}">
                Cancelar
            </a>

        </form>

    </main>

</body>

</html>
